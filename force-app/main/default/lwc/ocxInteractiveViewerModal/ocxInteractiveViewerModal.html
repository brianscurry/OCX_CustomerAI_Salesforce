<template>
    <lightning-modal-header label={modalTitle}>
    </lightning-modal-header>

    <lightning-modal-body>
        <div class="viewer-shell">
            <iframe
                class="viewer-frame"
                src={safeViewerUrl}
                title={modalTitle}
                allow="fullscreen"
                referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>
        </div>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button
            label="Close"
            onclick={handleClose}
        ></lightning-button>
    </lightning-modal-footer>
</template>
